<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLI Punk Workbench</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 0; height: 100%; margin: 0; overflow: hidden; }
    body { background: #f8f5e9; }
    #game-container { width: 100%; height: 100%; position: relative; }
    #app { width: 100%; height: 100%; }
  </style>
</head>
<body data-theme="bauhaus">
  <main id="game-container">
    <div id="app"></div>
  </main>

  <div id="folder-picker-overlay" class="hidden"></div>
  <div id="dialog-overlay" class="hidden"></div>
  <div id="resume-picker-overlay" class="hidden"></div>
  <div id="theme-settings-overlay" class="hidden"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
