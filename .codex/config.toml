model = "gpt-5.5"
model_reasoning_effort = "xhigh"
disable_response_storage = true
project_doc_fallback_filenames = ["AGENTS.md"]

[features]
multi_agent = true

[agents]
max_threads = 5
max_depth = 2

[agents.cli_punk_coordinator]
description = "Coordinate cli-punk redevelopment milestones, handoffs, file ownership, and release synthesis."
config_file = "../agents/cli-punk-coordinator.toml"

[agents.backend_contract_security_engineer]
description = "Preserve backend contract while adding auth, roles, path safety, audit, and REST/WebSocket hardening."
config_file = "../agents/backend/backend-contract-security-engineer.toml"

[agents.cli_tui_core_engineer]
description = "Build the CLI command surface, TUI shell, terminal pane, sessions, hotkeys, reconnect, and replay."
config_file = "../agents/cli/cli-tui-core-engineer.toml"

[agents.file_workflows_engineer]
description = "Build File Warp, file browser, editor, upload/download, and Claude config panel workflows."
config_file = "../agents/files/file-workflows-engineer.toml"

[agents.activity_usage_engineer]
description = "Build Claude activity, usage/context/cost aggregation, and reliable source labeling."
config_file = "../agents/activity/activity-usage-engineer.toml"

[agents.qa_release_engineer]
description = "Own test architecture, fake agent fixtures, security regression, TUI smoke, and release gates."
config_file = "../agents/quality/qa-release-engineer.toml"

[agents.process_reviewer]
description = "Audit handoffs, evidence quality, role boundaries, and readiness before delivery."
config_file = "../agents/quality/process-reviewer.toml"
